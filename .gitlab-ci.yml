# Сборка npm-пакета (AAR + XCFramework + JS) и публикация в GitLab Package Registry + Release.
# Нужен macOS runner (self-hosted tag `macos` или GitLab SaaS `saas-macos-medium-m1`).

stages:
  - test
  - build
  - release

variables:
  PACKAGE_REGISTRY_NAME: geoworker
  # Раскомментируйте для GitLab.com SaaS macOS вместо self-hosted:
  # MACOS_TAG: saas-macos-medium-m1

.macos_runner:
  tags:
    - macos
  # Для SaaS замените блок tags выше на:
  # tags:
  #   - saas-macos-medium-m1

# Unit tests before pack (blocks bad releases)
test:
  extends: .macos_runner
  stage: test
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  before_script:
    - java -version
    - chmod +x gradlew
  script:
    - ./gradlew :app:shared:testAndroidHostTest --no-daemon
  artifacts:
    when: always
    paths:
      - app/shared/build/reports/tests/
    expire_in: 7 days

# Ручной прогон / тег v* — сборка артефакта
pack:
  extends: .macos_runner
  stage: build
  needs:
    - job: test
      optional: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "web"
  before_script:
    - java -version
    - node -v
    - chmod +x gradlew scripts/pack-npm.sh
  script:
    - |
      if [[ -n "${CI_COMMIT_TAG:-}" && "${CI_COMMIT_TAG}" == v* ]]; then
        VERSION="${CI_COMMIT_TAG#v}"
      else
        VERSION="$(node -p "require('./package.json').version")"
      fi
      echo "Resolved version: ${VERSION}"
      echo "VERSION=${VERSION}" > version.env
    - ./gradlew :core:assembleAndroidMain :app:shared:assembleAndroidMain --no-daemon
    - ./gradlew :app:shared:assembleSharedLocationTrackerXCFramework --no-daemon
    - ./scripts/pack-npm.sh "${VERSION}"
    - ls -lh "dist/transline-geoworker-${VERSION}.tgz"
  artifacts:
    paths:
      - dist/*.tgz
    reports:
      dotenv: version.env
    expire_in: 7 days

# Только на теге: Generic Package Registry + GitLab Release
publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: pack
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - |
      set -euo pipefail
      VERSION="${CI_COMMIT_TAG#v}"
      FILE="transline-geoworker-${VERSION}.tgz"
      PACKAGE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_REGISTRY_NAME}/${VERSION}/${FILE}"

      echo "Uploading ${FILE} → ${PACKAGE_URL}"
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "dist/${FILE}" \
        "${PACKAGE_URL}"

      echo "Creating GitLab Release ${CI_COMMIT_TAG}"
      release-cli create \
        --name "TranslineGeoWorker ${CI_COMMIT_TAG}" \
        --description "npm package @transline/geoworker ${VERSION} (JS + AAR + XCFramework + native bridge)" \
        --tag-name "${CI_COMMIT_TAG}" \
        --assets-link "{\"name\":\"${FILE}\",\"url\":\"${PACKAGE_URL}\",\"link_type\":\"package\"}"
